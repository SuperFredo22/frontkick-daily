name: Push Notifications

on:
  # Les crons GitHub sont en UTC fixe. Pour que les rappels restent à la bonne
  # heure de Paris été (UTC+2) comme hiver (UTC+1), chaque horaire a deux
  # déclencheurs (version été + version hiver) et le step "Déterminer le type"
  # calcule l'heure LOCALE de Paris : seul le déclencheur qui tombe dans la
  # bonne fenêtre envoie quelque chose, l'autre se termine sans rien faire.
  schedule:
    - cron: '30 5 * * *'   # 07h30 Paris été  — Prières du matin
    - cron: '30 6 * * *'   # 07h30 Paris hiver
    - cron: '0 7 * * *'    # 09h00 Paris été  — Première tâche
    - cron: '0 8 * * *'    # 09h00 Paris hiver
    - cron: '0 10 * * *'   # 12h00 Paris été  — Bilan midi
    - cron: '0 11 * * *'   # 12h00 Paris hiver
    - cron: '0 12 * * *'   # 14h00 Paris été  — Focus après-midi
    - cron: '0 13 * * *'   # 14h00 Paris hiver
    - cron: '0 14 * * *'   # 16h00 Paris été  — Sport
    - cron: '0 15 * * *'   # 16h00 Paris hiver
    - cron: '30 15 * * *'  # 17h30 Paris été  — Dernière heure productive
    - cron: '30 16 * * *'  # 17h30 Paris hiver
    - cron: '0 16 * * 0'   # 18h00 Paris été  — Bilan hebdo (dimanche)
    - cron: '0 17 * * *'   # 19h00 Paris été — Contenu / 18h00 hiver dim — Bilan hebdo
    - cron: '0 18 * * *'   # 19h00 Paris hiver — Contenu
    - cron: '30 18 * * *'  # 20h30 Paris été  — Prières du soir
    - cron: '30 19 * * *'  # 20h30 Paris hiver / 21h30 été — Journal
    - cron: '30 20 * * *'  # 21h30 Paris hiver — Journal
  workflow_dispatch:
    inputs:
      type:
        description: 'Type de notification à envoyer manuellement'
        required: true
        default: 'morning-prayer'
        type: choice
        options:
          - morning-prayer
          - first-task
          - midday
          - afternoon
          - sport
          - last-hour
          - content
          - evening-prayer
          - journal
          - weekly-review

# Empêche l'annulation involontaire de runs concurrents
concurrency:
  group: push-notifications
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Vérifier que CRON_SECRET est configuré
        run: |
          if [ -z "${{ secrets.CRON_SECRET }}" ]; then
            echo "::error::CRON_SECRET n'est pas défini dans les secrets GitHub."
            echo "Va dans Settings → Secrets and variables → Actions → New repository secret"
            exit 1
          fi
          echo "CRON_SECRET est présent"

      - name: Déterminer le type de notification
        id: notif
        run: |
          # Déclenchement manuel → type direct
          if [ -n "${{ github.event.inputs.type }}" ]; then
            echo "type=${{ github.event.inputs.type }}" >> $GITHUB_OUTPUT
            echo "Source: workflow_dispatch → ${{ github.event.inputs.type }}"
            exit 0
          fi

          # Heure LOCALE de Paris (gère été/hiver automatiquement)
          H=$(TZ=Europe/Paris date +%H)
          M=$(TZ=Europe/Paris date +%M)
          DOW=$(TZ=Europe/Paris date +%u)   # 1=lundi … 7=dimanche
          TOTAL=$(( 10#$H * 60 + 10#$M ))
          TYPE=""

          # Fenêtres ±14 min autour de l'heure cible (heure de Paris)
          if   [ "$DOW" = "7" ] && [ "$TOTAL" -ge 1066 ] && [ "$TOTAL" -le 1094 ]; then TYPE="weekly-review"   # dim 18h00
          elif [ "$TOTAL" -ge 436 ]  && [ "$TOTAL" -le 464 ];  then TYPE="morning-prayer"   # 07h30
          elif [ "$TOTAL" -ge 526 ]  && [ "$TOTAL" -le 554 ];  then TYPE="first-task"       # 09h00
          elif [ "$TOTAL" -ge 706 ]  && [ "$TOTAL" -le 734 ];  then TYPE="midday"           # 12h00
          elif [ "$TOTAL" -ge 826 ]  && [ "$TOTAL" -le 854 ];  then TYPE="afternoon"        # 14h00
          elif [ "$TOTAL" -ge 946 ]  && [ "$TOTAL" -le 974 ];  then TYPE="sport"            # 16h00
          elif [ "$TOTAL" -ge 1036 ] && [ "$TOTAL" -le 1064 ]; then TYPE="last-hour"        # 17h30
          elif [ "$TOTAL" -ge 1126 ] && [ "$TOTAL" -le 1154 ]; then TYPE="content"          # 19h00
          elif [ "$TOTAL" -ge 1216 ] && [ "$TOTAL" -le 1244 ]; then TYPE="evening-prayer"   # 20h30
          elif [ "$TOTAL" -ge 1276 ] && [ "$TOTAL" -le 1304 ]; then TYPE="journal"          # 21h30
          fi

          echo "type=$TYPE" >> $GITHUB_OUTPUT
          echo "Heure Paris: ${H}:${M} (total=${TOTAL}min, jour=${DOW}) → type='${TYPE}'"

      - name: Envoyer la notification
        if: steps.notif.outputs.type != ''
        run: |
          TYPE="${{ steps.notif.outputs.type }}"
          echo "Envoi de la notification: $TYPE"

          # Capture body + code HTTP séparément
          RESPONSE=$(curl -s -w "\n__HTTP_CODE__%{http_code}" -X GET \
            "https://frontkick-daily.vercel.app/api/cron?t=${TYPE}" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            --max-time 15)

          BODY=$(echo "$RESPONSE" | sed '/^__HTTP_CODE__/d')
          CODE=$(echo "$RESPONSE" | grep '__HTTP_CODE__' | sed 's/__HTTP_CODE__//')

          echo "HTTP $CODE — $BODY"

          case "$CODE" in
            200) echo "✓ Notification '$TYPE' traitée avec succès" ;;
            401) echo "::error::Authentification échouée (401) — vérifie que CRON_SECRET dans GitHub Secrets correspond exactement à la variable CRON_SECRET sur Vercel"; exit 1 ;;
            400) echo "::error::Type inconnu (400): $BODY"; exit 1 ;;
            500) echo "::error::Erreur serveur Vercel (500): $BODY — vérifie les variables d'environnement Vercel (VAPID_*, BLOB_READ_WRITE_TOKEN)"; exit 1 ;;
            "")  echo "::error::Pas de réponse — l'URL Vercel est peut-être inaccessible"; exit 1 ;;
            *)   echo "::error::Réponse inattendue HTTP $CODE: $BODY"; exit 1 ;;
          esac

      - name: Rien à envoyer (hors plage horaire)
        if: steps.notif.outputs.type == ''
        run: |
          echo "Heure Paris $(TZ=Europe/Paris date +'%H:%M') hors plage — rien à envoyer (normal : déclencheur de l'autre saison, ou retard GitHub > 14min)"

name: Push Notifications

on:
  # Horaires en UTC — Paris est UTC+2 en été (mai à oct), UTC+1 en hiver
  schedule:
    - cron: '30 5 * * *'   # 07h30 Paris — Prières du matin
    - cron: '0 7 * * *'    # 09h00 Paris — Première tâche
    - cron: '0 10 * * *'   # 12h00 Paris — Bilan midi
    - cron: '0 12 * * *'   # 14h00 Paris — Focus après-midi
    - cron: '0 14 * * *'   # 16h00 Paris — Sport
    - cron: '30 15 * * *'  # 17h30 Paris — Dernière heure productive
    - cron: '0 17 * * *'   # 19h00 Paris — Contenu & FightFocus
    - cron: '30 18 * * *'  # 20h30 Paris — Prières du soir
    - cron: '30 19 * * *'  # 21h30 Paris — Journal
  workflow_dispatch:
    inputs:
      type:
        description: 'Type de notification à envoyer manuellement'
        required: true
        default: 'morning-prayer'
        type: choice
        options:
          - morning-prayer
          - first-task
          - midday
          - afternoon
          - sport
          - last-hour
          - content
          - evening-prayer
          - journal

# Empêche l'annulation involontaire de runs concurrents
concurrency:
  group: push-notifications
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Vérifier que CRON_SECRET est configuré
        run: |
          if [ -z "${{ secrets.CRON_SECRET }}" ]; then
            echo "::error::CRON_SECRET n'est pas défini dans les secrets GitHub."
            echo "Va dans Settings → Secrets and variables → Actions → New repository secret"
            exit 1
          fi
          echo "CRON_SECRET est présent"

      - name: Déterminer le type de notification
        id: notif
        run: |
          # Déclenchement manuel → type direct
          if [ -n "${{ github.event.inputs.type }}" ]; then
            echo "type=${{ github.event.inputs.type }}" >> $GITHUB_OUTPUT
            echo "Source: workflow_dispatch → ${{ github.event.inputs.type }}"
            exit 0
          fi

          # Déclenchement cron → fenêtre ±15 min (GitHub peut être en retard de 1-15 min)
          TOTAL=$(( $(date -u +%H) * 60 + $(date -u +%M) ))
          TYPE=""

          if   [ "$TOTAL" -ge 315 ] && [ "$TOTAL" -le 345 ]; then TYPE="morning-prayer"
          elif [ "$TOTAL" -ge 405 ] && [ "$TOTAL" -le 435 ]; then TYPE="first-task"
          elif [ "$TOTAL" -ge 585 ] && [ "$TOTAL" -le 615 ]; then TYPE="midday"
          elif [ "$TOTAL" -ge 705 ] && [ "$TOTAL" -le 735 ]; then TYPE="afternoon"
          elif [ "$TOTAL" -ge 825 ] && [ "$TOTAL" -le 855 ]; then TYPE="sport"
          elif [ "$TOTAL" -ge 915 ] && [ "$TOTAL" -le 945 ]; then TYPE="last-hour"
          elif [ "$TOTAL" -ge 1005 ] && [ "$TOTAL" -le 1035 ]; then TYPE="content"
          elif [ "$TOTAL" -ge 1095 ] && [ "$TOTAL" -le 1125 ]; then TYPE="evening-prayer"
          elif [ "$TOTAL" -ge 1155 ] && [ "$TOTAL" -le 1185 ]; then TYPE="journal"
          fi

          echo "type=$TYPE" >> $GITHUB_OUTPUT
          echo "Heure UTC: $(date -u +'%H:%M') (total=${TOTAL}min) → type='${TYPE}'"

      - name: Envoyer la notification
        if: steps.notif.outputs.type != ''
        run: |
          TYPE="${{ steps.notif.outputs.type }}"
          echo "Envoi de la notification: $TYPE"

          # Capture body + code HTTP séparément
          RESPONSE=$(curl -s -w "\n__HTTP_CODE__%{http_code}" -X GET \
            "https://frontkick-daily.vercel.app/api/cron?t=${TYPE}" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            --max-time 15)

          BODY=$(echo "$RESPONSE" | sed '/^__HTTP_CODE__/d')
          CODE=$(echo "$RESPONSE" | grep '__HTTP_CODE__' | sed 's/__HTTP_CODE__//')

          echo "HTTP $CODE — $BODY"

          case "$CODE" in
            200) echo "✓ Notification '$TYPE' envoyée avec succès" ;;
            401) echo "::error::Authentification échouée (401) — vérifie que CRON_SECRET dans GitHub Secrets correspond exactement à la variable CRON_SECRET sur Vercel"; exit 1 ;;
            400) echo "::error::Type inconnu (400): $BODY"; exit 1 ;;
            500) echo "::error::Erreur serveur Vercel (500): $BODY — vérifie les variables d'environnement Vercel (VAPID_*, BLOB_READ_WRITE_TOKEN)"; exit 1 ;;
            "")  echo "::error::Pas de réponse — l'URL Vercel est peut-être inaccessible"; exit 1 ;;
            *)   echo "::error::Réponse inattendue HTTP $CODE: $BODY"; exit 1 ;;
          esac

      - name: Rien à envoyer (hors plage horaire)
        if: steps.notif.outputs.type == ''
        run: |
          echo "Heure actuelle $(date -u +'%H:%M') UTC hors plage de toutes les notifications — rien à envoyer (normal si GitHub a un retard > 15min)"
